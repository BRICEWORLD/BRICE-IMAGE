    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<header>

        <div class="logo">

        </div>

        <button class="menu-toggle" aria-label="باز کردن منو">

        <nav class="main-nav">

            <a href="../index.html">

            </a>

            <a href="hero.html">
                تصاویر خلاقانه
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="category-hero">

        <div class="container">

            <h1>
                برندسازی
            </h1>

            <p>
                آثار گرافیکی، طراحی‌های خلاقانه و محتوای برندسازی.
            </p>

        </div>

    </section>


    <section class="category-section">

        <div class="container">

            <div
                id="branding-grid"
                class="image-grid"
            >
                <p class="loading-text">
                    در حال بارگذاری تصاویر...
                </p>
            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <p>
            © <span id="current-year"></span> BRICE IMAGE
        </p>

    </div>

</footer>


<script src="../script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {

    const grid = document.getElementById("branding-grid");

    const REPO = "BRICEWORLD/BRICE-IMAGE";
    const BRANCH = "main";

    const IMAGE_BASE =
        "https://briceworld.github.io/BRICE-IMAGE/";


    async function getFolder(path) {

        const url =
            `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(
                `GitHub API Error: ${response.status}`
            );
        }

        return await response.json();
    }


    function isImage(file) {

        if (file.type !== "file") {
            return false;
        }

        return /\.(jpg|jpeg|png|webp|gif)$/i.test(
            file.name
        );
    }


    try {

        const files = await getFolder("images/branding");


        const images = files
            .filter(isImage)
            .sort((a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
            );


        if (images.length === 0) {

            grid.innerHTML = `
                <p>
                    هنوز تصویری در این دسته اضافه نشده است.
                </p>
            `;

            return;
        }


        grid.innerHTML = "";


        images.forEach((file) => {

            const card =
                document.createElement("a");

            card.className =
                "image-card";


            const imageId =
                file.path
                    .replace(/\//g, "-")
                    .replace(/\.[^/.]+$/, "");


            const imageUrl =
                IMAGE_BASE + file.path;


            const title =
                "برندسازی";


            card.href =
                `../image.html?id=${encodeURIComponent(imageId)}`;


            card.innerHTML = `
                
                <img
                    src="${imageUrl}"
                    alt="${title} | BRICE IMAGE"
                    loading="lazy"
                    decoding="async"
                >

                <h3>
                    ${title}
                </h3>

            `;


            grid.appendChild(card);

        });


    } catch (error) {

        console.error(
            "BRICE IMAGE ERROR:",
            error
        );


        grid.innerHTML = `
            <p>
                خطا در بارگذاری تصاویر.
                لطفاً دوباره تلاش کنید.
            </p>
        `;

    }

});

</script>

</body>
</html>
